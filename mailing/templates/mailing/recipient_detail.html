{% extends "mailing/base.html" %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
            <div class="container">

              <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div class="col">
                  <div class="card shadow-sm">
                    <div class="card-body">
                      <h5 class="card-title"> Email: {{ object.email }}</h5>
                      <h6 class="card-title"> ФИО: {{ object.full_name }} </h6>
                      <p class="card-text"> Комментарий: {{ object.comment }} </p>
                      <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                          <a class="btn btn-primary" href="{% url 'mailing:home' %}">Назад</a>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
</div>
{% endblock %}
