{% extends "mailing/base.html" %}
{% block header %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
            <h1 class="display-4">Система управления рассылками</h1>
            <p class="lead">Добавление/редактирование рассылки</p>
    </div>
{% endblock %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {% if not object %}
                            <input type="hidden" name="status" value="created">
                            <div class="form-group">
                                <label for="{{ form.message.id_for_label }}">Сообщение:</label>
                                {{ form.message }}
                            </div>
                            <div class="form-group mt-3">
                                <label for="{{ form.recipient.id_for_label }}">Получатели:</label>
                                {{ form.recipient }}
                            </div>
                        {% else %}
                            {{ form.as_p }}
                        {% endif %}
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-outline-primary mb-3">
                            {% if object %}
                            Сохранить
                            {% else %}
                            Создать
                            {% endif %}
                        </button>
                        <a href="{% url 'mailing:dispatches_list' %}" class="btn btn-outline-secondary mb-3">Отмена</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
