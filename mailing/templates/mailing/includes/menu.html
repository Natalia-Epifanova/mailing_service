<div class="d-flex justify-content-between align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <div class="d-flex align-items-center">
        <nav class="me-4">
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:home' %}">Главная</a>
            {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:recipients_list' %}">Список доступных получателей</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:messages_list' %}">Список доступных сообщений</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:dispatches_list' %}">Список доступных рассылок</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:mailing_attempts_list' %}">Список попыток рассылок</a>
            {% endif %}
        </nav>
    </div>
    <nav>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:profile_detail' user.pk %}">Информация о профиле</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:edit_profile' %}">Редактировать профиль</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:logout' %}">Выход</a>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
