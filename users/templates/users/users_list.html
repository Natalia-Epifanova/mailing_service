{% extends "mailing/base.html" %}

{% block content %}
<div class="container mt-5">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Email</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>
                {% if user.is_blocked %}
                <span>Заблокирован</span>
                {% else %}
                <span>Активен</span>
                {% endif %}
            </td>
            <td>
                <form method="post" action="{% url 'users:toggle_block' user.pk %}">
                    {% csrf_token %}
                    <button type="submit"
                            class="btn btn-sm {% if user.is_blocked %}btn-success{% else %}btn-danger{% endif %}">
                        {% if user.is_blocked %}Разблокировать{% else %}Заблокировать{% endif %}
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
