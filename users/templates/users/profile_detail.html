{% extends "mailing/base.html" %}
{% load my_tags %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ object.avatar | media_filter }}" class="card-img-top img-fluid mt-4 mb-4 px-4">
                    <div class="card-body">
                        <h5 class="card-title">Email: {{ object.email }}</h5>
                        <p class="card-title">Телефон: {{ object.phone }}</p>
                        <p class="card-text">Страна: {{ object.country }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailing:home' %}">Назад</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
